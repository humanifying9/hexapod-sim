# Parameters for hexapod_control/tripod_gait_controller.
#
# link lengths / coxa_tilt_deg MUST match hexapod_description/urdf/common.xacro
# - see the note at the top of that file. If you re-measure the robot, change
# it there first, then here.
tripod_gait_controller:
  ros__parameters:
    coxa_length: 0.0675
    femur_length: 0.0875
    tibia_length: 0.1075
    coxa_tilt_deg: 50.0

    # Neutral standing foot position, in the leg-local frame (same for all six
    # legs - see leg_kinematics.py). stance_reach is horizontal distance
    # beyond the coxa joint; stance_drop is how far below it the foot rests.
    #
    # These were tuned for the older, longer leg dimensions. With the real
    # measured lengths (coxa 67.5 / femur 87.5 / tibia 107.5mm), the old
    # 80/110mm stance forced the femur to bend past 90 deg from horizontal
    # to reach it - folding backward toward the body instead of continuing
    # outward. These values keep the femur's true angle below horizontal
    # (coxa_tilt_deg + femur_command) around 68 deg - well short of 90.
    stance_reach: 0.140
    stance_drop: 0.090

    gait_period: 1.0       # seconds per full swing+stance cycle
    step_height: 0.050     # foot lift height during swing, metres
    # Clamped down from 0.075: with the new, larger stance_reach, a bigger
    # stride would push the target past the leg's max reach (195mm) and get
    # silently clamped by leg_kinematics.py anyway - this keeps it inside
    # with a small safety margin instead.
    max_step_length: 0.030 # clamp on stride length per axis, metres

    control_rate: 50.0     # Hz
    cmd_vel_timeout: 0.5   # seconds - no /cmd_vel this recent -> stand still
