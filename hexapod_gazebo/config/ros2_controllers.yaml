controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_effort_controller:
      type: effort_controllers/JointGroupEffortController

    joint_group_position_controller:
      type: position_controllers/JointGroupPositionController

# gz_ros2_control's GazeboSimSystem (logs as node "gz_ros_control") converts
# each position command into a velocity command via its own internal P loop:
# joint_velocity = position_proportional_gain * position_error * update_rate
# (see hexapod.ros2_control.xacro's comment). This was never actually set,
# so it ran on the plugin's default of 0.1 - nowhere near strong enough to
# track against real leg mass under gravity (commanded 17.9deg measured
# sagging to 50.8deg under load, stable, not just still-converging). It's a
# single global gain, not per-joint - lives under its own top-level
# "gz_ros_control" key, NOT nested under controller_manager (confirmed
# against the gz_ros2_control docs after two wrong guesses at the
# structure - controller_manager: ros__parameters: <joint>.position_... and
# a separate top-level block per joint name were both silently ignored).
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 50.0

joint_group_position_controller:
  ros__parameters:
    joints:
      - fl_coxa_joint
      - fl_femur_joint
      - fl_tibia_joint
      - ml_coxa_joint
      - ml_femur_joint
      - ml_tibia_joint
      - rl_coxa_joint
      - rl_femur_joint
      - rl_tibia_joint
      - fr_coxa_joint
      - fr_femur_joint
      - fr_tibia_joint
      - mr_coxa_joint
      - mr_femur_joint
      - mr_tibia_joint
      - rr_coxa_joint
      - rr_femur_joint
      - rr_tibia_joint

joint_group_effort_controller:
  ros__parameters:
    joints:
      - fl_coxa_joint
      - fl_femur_joint
      - fl_tibia_joint
      - ml_coxa_joint
      - ml_femur_joint
      - ml_tibia_joint
      - rl_coxa_joint
      - rl_femur_joint
      - rl_tibia_joint
      - fr_coxa_joint
      - fr_femur_joint
      - fr_tibia_joint
      - mr_coxa_joint
      - mr_femur_joint
      - mr_tibia_joint
      - rr_coxa_joint
      - rr_femur_joint
      - rr_tibia_joint
